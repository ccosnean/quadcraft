name: "Quadcraft"
subtitle: "回して、切って、重ねて合わせる"
short_description: "図形を回して、切って、重ねて目標に合わせる。静かなオフラインパズル。"
description: |
  Quadcraftは、形についての静かなパズルゲームです。シンプルな立体を回して、切って、重ねて、目標のシルエットにぴったり合わせましょう。タイマーもペナルティもなく、ジオメトリを正確に合わせる満足感だけがあります。

  一つずつ仕組みを教えてくれる手作りのキャンペーンを進み、その先は「ダイブ」モードへ。潜れば潜るほど奇妙になっていく無限の生成パズルで、クリアした形はコレクションとして残ります。

  気に入ったパズルができたら、コードやQRコードとして共有しましょう。誰でもスキャンして、あなたの手数に挑戦できます。

  - 回して、切って、重ねて目標の形に合わせる
  - 完全なキャンペーンと、深さに応じた無限のダイブモード
  - コードやQRコードでレベルを共有・受信
  - 落ち着いたミニマルなビジュアルと、オプションのサウンドトラック
  - 広告なし、アプリ内課金なし、完全オフラインでプレイ可能
  - 13言語対応
keywords: "パズル,図形,幾何学,脳トレ,リラックス,オフライン,ミニマル,カジュアル,3D,ロジック"
promo_text: "形についての静かなパズル：回して、切って、重ねて目標に合わせる。完全なキャンペーン、無限のダイブモード、コードやQRで共有できるレベル。"
release_notes: "初回リリース。Quadcraftへようこそ！"
