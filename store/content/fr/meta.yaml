name: "Quadcraft"
subtitle: "Tournez, coupez, empilez."
short_description: "Tournez, coupez, empilez pour égaler la cible. Puzzle calme et hors ligne."
description: |
  Quadcraft est un puzzle paisible sur les formes. Tournez, coupez et empilez des solides simples jusqu'à ce qu'ils correspondent à la silhouette cible — sans chronomètre, sans pénalité, juste la satisfaction d'une géométrie parfaitement ajustée.

  Progressez dans une campagne conçue à la main qui enseigne les mécaniques une idée à la fois, puis poursuivez dans la Plongée : une série infinie de puzzles générés qui deviennent plus étranges à mesure que vous descendez, avec une collection de chaque forme résolue.

  Vous avez trouvé un puzzle dont vous êtes fier ? Partagez-le sous forme de code ou de QR pour que n'importe qui le scanne et tente de battre votre nombre de coups.

  - Tournez, coupez et empilez pour égaler une forme cible
  - Campagne complète et mode Plongée infini par profondeur
  - Partagez et recevez des niveaux via un code ou un QR
  - Visuels minimalistes et apaisants, bande sonore optionnelle
  - Sans publicité, sans achat intégré, entièrement hors ligne
  - Disponible en 13 langues
keywords: "puzzle,formes,geometrie,cerveau,detente,hors ligne,minimal,casual,3d,logique"
promo_text: "Un puzzle paisible sur les formes : tournez, coupez et empilez pour égaler la cible. Campagne complète, mode Plongée infini, et niveaux à partager par code ou QR."
release_notes: "Première version. Bienvenue dans Quadcraft !"
