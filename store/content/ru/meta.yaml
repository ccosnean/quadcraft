name: "Quadcraft"
subtitle: "Верти, режь, складывай."
short_description: "Крутите, режьте, складывайте фигуры, чтобы совпасть с целью. Офлайн-пазл."
description: |
  Quadcraft — спокойная головоломка о формах. Крутите, режьте и складывайте простые фигуры, пока они не совпадут с силуэтом цели — без таймера и штрафов, только удовольствие от точной геометрии.

  Пройдите вручную выстроенную кампанию, которая учит механикам шаг за шагом, а затем продолжайте в режиме Погружения: бесконечная серия генерируемых головоломок, которые становятся причудливее с глубиной, с растущей коллекцией каждой пройденной формы.

  Нашли головоломку, которой гордитесь? Поделитесь ею как кодом или QR — любой сможет отсканировать и попытаться превзойти ваше число ходов.

  - Крутите, режьте и складывайте, чтобы совпасть с целевой формой
  - Полная кампания плюс бесконечный режим Погружения по глубине
  - Делитесь и получайте уровни по коду или QR
  - Спокойная минималистичная графика с необязательным саундтреком
  - Без рекламы, без покупок в приложении, полностью офлайн
  - Доступно на 13 языках
keywords: "пазл,фигуры,геометрия,мозг,релакс,офлайн,минимализм,казуальная,3d,логика"
promo_text: "Спокойная головоломка о формах: крутите, режьте и складывайте, чтобы совпасть с целью. Полная кампания, бесконечный режим Погружения и уровни для обмена по коду или QR."
release_notes: "Первый релиз. Добро пожаловать в Quadcraft!"
