name: "Quadcraft"
subtitle: "돌리고 자르고 쌓아서 맞추기"
short_description: "도형을 돌리고 자르고 쌓아서 목표에 맞추세요. 조용한 오프라인 퍼즐."
description: |
  Quadcraft는 도형에 관한 조용한 퍼즐 게임입니다. 간단한 입체 도형을 돌리고 자르고 쌓아서 목표 실루엣과 정확히 맞춰보세요. 타이머도, 페널티도 없이 기하학을 정확히 맞추는 만족감만 있습니다.

  하나씩 규칙을 알려주는 수작업 캠페인을 진행한 뒤, 다이브 모드로 이어가세요. 깊이 내려갈수록 더 기묘해지는 끝없는 생성형 퍼즐과, 클리어한 모든 도형을 모으는 컬렉션이 기다립니다.

  자랑스러운 퍼즐을 발견했다면 코드나 QR로 공유해 보세요. 누구나 스캔해서 당신의 이동 횟수에 도전할 수 있습니다.

  - 돌리고 자르고 쌓아서 목표 도형에 맞추기
  - 완전한 캠페인과 깊이 기반의 끝없는 다이브 모드
  - 코드나 QR로 레벨 공유 및 수신
  - 차분하고 미니멀한 비주얼, 선택 가능한 사운드트랙
  - 광고 없음, 인앱 결제 없음, 완전 오프라인 플레이
  - 13개 언어 지원
keywords: "퍼즐,도형,기하학,두뇌,휴식,오프라인,미니멀,캐주얼,3d,논리"
promo_text: "도형에 관한 조용한 퍼즐: 돌리고 자르고 쌓아서 목표에 맞추세요. 완전한 캠페인, 끝없는 다이브 모드, 코드나 QR로 공유하는 레벨."
release_notes: "첫 출시. Quadcraft에 오신 것을 환영합니다!"
