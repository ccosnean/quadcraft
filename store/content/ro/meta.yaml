name: "Quadcraft"
subtitle: "Rotește, taie, stivuiește."
short_description: "Rotește, taie și stivuiește forme ca să potrivești ținta. Puzzle calm, offline."
description: |
  Quadcraft este un puzzle liniștit despre forme. Rotește, taie și stivuiește solide simple până se potrivesc cu silueta țintă — fără cronometru, fără penalizări, doar satisfacția de a nimeri geometria exact.

  Parcurge o campanie construită manual care predă mecanicile pas cu pas, apoi continuă în modul Scufundare: o serie infinită de puzzle-uri generate care devin tot mai stranii cu cât cobori mai adânc, cu o colecție a fiecărei forme rezolvate.

  Ai găsit un puzzle de care ești mândru? Distribuie-l ca și cod sau cod QR, ca oricine să îl scaneze și să încerce să îți bată numărul de mutări.

  - Rotește, taie și stivuiește ca să potrivești o formă țintă
  - Campanie completă plus un mod Scufundare infinit, pe adâncime
  - Distribuie și primește niveluri printr-un cod sau cod QR
  - Vizual minimalist și calm, cu coloană sonoră opțională
  - Fără reclame, fără achiziții din aplicație, funcționează complet offline
  - Disponibil în 13 limbi
keywords: "puzzle,forme,geometrie,creier,relaxare,offline,minimal,casual,3d,logica"
promo_text: "Un puzzle liniștit despre forme: rotește, taie și stivuiește ca să potrivești ținta. Campanie completă, mod Scufundare infinit și niveluri de distribuit prin cod sau QR."
release_notes: "Prima lansare. Bun venit în Quadcraft!"
