name: "Quadcraft"
subtitle: "Gire, corte, empilhe. Encaixe."
short_description: "Gire, corte e empilhe formas para igualar o alvo. Puzzle offline e tranquilo."
description: |
  Quadcraft é um puzzle tranquilo sobre formas. Gire, corte e empilhe sólidos simples até que combinem com a silhueta alvo — sem cronômetro, sem penalidades, só a satisfação de acertar a geometria.

  Avance por uma campanha feita à mão que ensina a mecânica ideia por ideia, depois continue no Mergulho: uma sequência infinita de puzzles gerados que ficam mais estranhos quanto mais fundo você vai, com uma coleção de cada forma que já resolveu.

  Encontrou um puzzle do qual se orgulha? Compartilhe como código ou QR para qualquer pessoa escanear e tentar bater seu número de jogadas.

  - Gire, corte e empilhe para igualar uma forma alvo
  - Campanha completa mais um modo Mergulho infinito por profundidade
  - Compartilhe e receba níveis com um código ou QR
  - Visual minimalista e tranquilo, com trilha sonora opcional
  - Sem anúncios, sem compras no app, funciona totalmente offline
  - Disponível em 13 idiomas
keywords: "puzzle,formas,geometria,cerebro,relaxar,offline,minimal,casual,3d,logica"
promo_text: "Um puzzle tranquilo sobre formas: gire, corte e empilhe para igualar o alvo. Campanha completa, modo Mergulho infinito e níveis para compartilhar com código ou QR."
release_notes: "Primeira versão. Bem-vindo ao Quadcraft!"
