name: "Quadcraft"
subtitle: "Drehen, schneiden, stapeln."
short_description: "Formen drehen, schneiden, stapeln, bis sie passen. Ruhiges Offline-Puzzle."
description: |
  Quadcraft ist ein ruhiges Puzzle über Formen. Drehe, schneide und stapele einfache Körper, bis sie zur Zielsilhouette passen — kein Timer, keine Strafen, nur die Befriedigung, die Geometrie exakt hinzubekommen.

  Arbeite dich durch eine handgebaute Kampagne, die dir die Mechaniken Schritt für Schritt beibringt, und mach dann im Tauchgang weiter: eine endlose Reihe generierter Rätsel, die mit zunehmender Tiefe seltsamer werden, samt einer Sammlung jeder gelösten Form.

  Ein Rätsel gefunden, auf das du stolz bist? Teile es als Code oder QR-Code, damit andere es scannen und deine Zugzahl schlagen können.

  - Drehen, schneiden und stapeln, um eine Zielform zu treffen
  - Vollständige Kampagne plus endloser, tiefenbasierter Tauchgang-Modus
  - Level per Code oder QR-Code teilen und empfangen
  - Ruhige, minimalistische Optik mit optionalem Soundtrack
  - Keine Werbung, keine In-App-Käufe, funktioniert komplett offline
  - Verfügbar in 13 Sprachen
keywords: "puzzle,formen,geometrie,gehirn,entspannen,offline,minimal,casual,3d,logik"
promo_text: "Ein ruhiges Puzzle: drehen, schneiden und stapeln, um das Ziel zu treffen. Volle Kampagne, endloser Tauchgang, Level zum Teilen per Code oder QR."
release_notes: "Erste Veröffentlichung. Willkommen bei Quadcraft!"
