name: "Quadcraft"
subtitle: "旋转、切割、堆叠，匹配目标"
short_description: "旋转、切割、堆叠方块，匹配目标形状。安静耐玩的离线解谜游戏。"
description: |
  《Quadcraft》是一款安静的形状解谜游戏。旋转、切割、堆叠简单的方块，直到它们与目标轮廓完全吻合——没有计时器，没有惩罚，只有把几何形状拼对时的满足感。

  跟随精心设计的主线关卡循序渐进地学习玩法，然后进入"下潜"模式：一场没有尽头的生成式解谜之旅，越深入越奇妙，还会不断收集你通关过的每一个形状。

  解出了满意的关卡？把它分享成代码或二维码，让任何人扫描挑战你的步数。

  - 旋转、切割、堆叠，匹配目标形状
  - 完整主线关卡 + 无尽的"下潜"深度模式
  - 用代码或二维码分享与接收关卡
  - 简约宁静的视觉风格，可选配乐
  - 无广告，无内购，完全离线可玩
  - 支持13种语言
keywords: "拼图,几何,方块,益智,放松,离线,极简,休闲,3D,逻辑,禅意"
promo_text: "一款安静的形状解谜游戏：旋转、切割、堆叠，匹配目标。完整主线关卡，无尽的下潜模式，还能用代码或二维码分享关卡。"
release_notes: "首次发布，欢迎来到 Quadcraft！"
