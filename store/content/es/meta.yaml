name: "Quadcraft"
subtitle: "Gira, corta, apila. Encaja."
short_description: "Gira, corta y apila formas para igualar el objetivo. Puzzle offline tranquilo."
description: |
  Quadcraft es un puzzle tranquilo sobre formas. Gira, corta y apila sólidos simples hasta que coincidan con la silueta objetivo, sin cronómetro ni penalizaciones: solo la satisfacción de acertar la geometría exacta.

  Avanza por una campaña hecha a mano que enseña la mecánica paso a paso, y luego sigue en la Inmersión: una serie infinita de puzles generados que se vuelven más extraños cuanto más profundo llegas, con una colección de cada forma que has resuelto.

  ¿Encontraste un puzzle del que estás orgulloso? Compártelo como código o QR para que cualquiera lo escanee e intente superar tu número de movimientos.

  - Gira, corta y apila para igualar una forma objetivo
  - Campaña completa más un modo Inmersión infinito por profundidad
  - Comparte y recibe niveles con un código o QR
  - Estética mínima y tranquila, con banda sonora opcional
  - Sin anuncios, sin compras dentro de la app, funciona sin conexión
  - Disponible en 13 idiomas
keywords: "puzzle,formas,geometria,cerebro,relax,offline,minimal,casual,3d,logica,zen"
promo_text: "Un puzzle tranquilo sobre formas: gira, corta y apila para igualar el objetivo. Campaña completa, Inmersión infinita y niveles para compartir por código o QR."
release_notes: "Primera versión. ¡Bienvenido a Quadcraft!"
