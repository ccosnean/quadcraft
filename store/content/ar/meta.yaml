name: "Quadcraft"
subtitle: "أدر واقطع وكدّس لتطابق الهدف"
short_description: "أدر واقطع وكدّس الأشكال لمطابقة الهدف. لغز هادئ يعمل دون اتصال."
description: |
  Quadcraft لغز هادئ عن الأشكال. أدر واقطع وكدّس مجسمات بسيطة حتى تطابق المخطط المستهدف — بلا عدّاد زمني وبلا عقوبات، فقط متعة ضبط الهندسة تمامًا.

  اعبر حملة مصمَّمة يدويًا تعلّمك الآليات فكرة تلو الأخرى، ثم واصل في وضع الغوص: سلسلة لا نهائية من الألغاز المولَّدة تزداد غرابةً كلما تعمّقت، مع مجموعة تنمو من كل شكل أتممته.

  وجدت لغزًا تفخر به؟ شاركه كرمز أو رمز QR، ليحاول أي شخص مسحه ومنافستك في عدد الحركات.

  - أدر واقطع وكدّس لمطابقة شكل مستهدف
  - حملة كاملة بالإضافة إلى وضع غوص لا نهائي حسب العمق
  - شارك واستقبل المستويات برمز أو رمز QR
  - مرئيات هادئة وبسيطة مع موسيقى اختيارية
  - بلا إعلانات، بلا مشتريات داخل التطبيق، يعمل دون اتصال بالكامل
  - متوفر بـ 13 لغة
keywords: "لغز,أشكال,هندسة,ذهني,استرخاء,دون اتصال,بسيط,3d,منطق"
promo_text: "لغز هادئ عن الأشكال: أدر واقطع وكدّس لمطابقة الهدف. حملة كاملة، وضع غوص لا نهائي، ومستويات يمكنك مشاركتها برمز أو QR."
release_notes: "الإصدار الأول. أهلًا بك في Quadcraft!"
