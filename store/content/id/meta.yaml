name: "Quadcraft"
subtitle: "Putar, potong, tumpuk. Cocok."
short_description: "Putar, potong, tumpuk untuk mencocokkan target. Puzzle offline yang tenang."
description: |
  Quadcraft adalah puzzle yang tenang tentang bentuk. Putar, potong, dan tumpuk bentuk padat sederhana hingga cocok dengan siluet target — tanpa pengatur waktu, tanpa hukuman, hanya kepuasan menyusun geometri dengan tepat.

  Mainkan kampanye yang dirancang tangan yang mengajarkan mekanika selangkah demi selangkah, lalu lanjutkan di mode Selam: rangkaian puzzle tanpa akhir yang makin aneh semakin dalam Anda pergi, lengkap dengan koleksi setiap bentuk yang pernah Anda selesaikan.

  Menemukan puzzle yang Anda banggakan? Bagikan sebagai kode atau QR agar siapa pun bisa memindainya dan mencoba mengalahkan jumlah langkah Anda.

  - Putar, potong, dan tumpuk untuk mencocokkan bentuk target
  - Kampanye lengkap plus mode Selam tanpa akhir berbasis kedalaman
  - Bagikan dan terima level dengan kode atau QR
  - Visual minimalis dan tenang, dengan musik opsional
  - Tanpa iklan, tanpa pembelian dalam aplikasi, berjalan sepenuhnya offline
  - Tersedia dalam 13 bahasa
keywords: "puzzle,bentuk,geometri,otak,santai,offline,minimal,kasual,3d,logika"
promo_text: "Puzzle tenang tentang bentuk: putar, potong, tumpuk untuk cocok dengan target. Kampanye lengkap, mode Selam tanpa akhir, level dibagikan via kode/QR."
release_notes: "Rilis pertama. Selamat datang di Quadcraft!"
