name: "Quadcraft"
subtitle: "घुमाएँ, काटें, जमाएँ"
short_description: "आकृतियाँ घुमाएँ, काटें और जमाएँ — लक्ष्य से मिलाएँ। शांत, ऑफ़लाइन पहेली।"
description: |
  Quadcraft आकृतियों के बारे में एक शांत पहेली खेल है। सरल ठोस आकृतियों को तब तक घुमाएँ, काटें और जमाएँ जब तक वे लक्ष्य आकृति से पूरी तरह मेल न खाएँ — न कोई टाइमर, न कोई दंड, बस ज्यामिति को सही ढंग से मिलाने का संतोष।

  हाथ से बनाए गए अभियान से शुरुआत करें जो एक-एक करके सारी युक्तियाँ सिखाता है, फिर "डाइव" मोड में आगे बढ़ें: जनरेट की गई पहेलियों की एक अनंत श्रृंखला, जो जितना गहरा जाएँ उतनी अनोखी होती जाती है, साथ ही हर हल की गई आकृति का बढ़ता हुआ संग्रह भी।

  कोई ऐसी पहेली मिली जिस पर आपको गर्व हो? उसे कोड या QR के रूप में साझा करें — कोई भी उसे स्कैन करके आपकी चालों की संख्या को हराने की कोशिश कर सकता है।

  - लक्ष्य आकृति से मिलाने के लिए घुमाएँ, काटें और जमाएँ
  - पूरा अभियान और गहराई पर आधारित अनंत "डाइव" मोड
  - कोड या QR से स्तर साझा करें और प्राप्त करें
  - शांत, न्यूनतम विज़ुअल्स और वैकल्पिक संगीत
  - कोई विज्ञापन नहीं, कोई इन-ऐप खरीद नहीं, पूरी तरह ऑफ़लाइन चलता है
  - 13 भाषाओं में उपलब्ध
keywords: "पहेली,आकृति,ज्यामिति,दिमाग,आराम,ऑफलाइन,न्यूनतम,कैज़ुअल,3d,तर्क"
promo_text: "आकृतियों के बारे में एक शांत पहेली: घुमाएँ, काटें और जमाएँ ताकि लक्ष्य से मेल खाए। पूरा अभियान, अनंत डाइव मोड, और कोड या QR से साझा करने योग्य स्तर।"
release_notes: "पहला रिलीज़। Quadcraft में आपका स्वागत है!"
