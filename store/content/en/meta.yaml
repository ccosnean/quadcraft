name: "Quadcraft"
subtitle: "Turn. Cut. Stack. Match."
short_description: "Rotate, cut and stack shapes to match the target. Calm, offline puzzles."
description: |
  Quadcraft is a quiet puzzle about shape. Rotate, cut and stack simple solids until they match the target silhouette — no timers, no penalties, just the satisfaction of getting the geometry exactly right.

  Work through a hand-built campaign that teaches the mechanics one idea at a time, then keep going in the Dive: an endless run of generated puzzles that get stranger the deeper you go, with a running collection of every shape you've cleared.

  Found a puzzle you're proud of? Share it as a code or a QR — anyone can scan it and try to beat your move count.

  - Rotate, cut, and stack to match a target shape
  - A full campaign plus an endless, depth-based Dive mode
  - Share and receive levels with a code or QR
  - Calm, minimal visuals with an optional soundtrack
  - No ads, no in-app purchases, works fully offline
  - Available in 13 languages
keywords: "puzzle,shapes,geometry,brain,relax,offline,minimal,casual,3d,logic,zen,calm"
promo_text: "A quiet puzzle about shape: rotate, cut and stack to match the target. Full campaign, an endless Dive mode, and levels you can share with a code or QR."
release_notes: "First release. Welcome to Quadcraft!"
